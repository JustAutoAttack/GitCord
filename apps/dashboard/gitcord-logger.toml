#:schema ./gitcord-logger.schema.json

[logger]
level           = "INFO"
timestampFormat = "ISO"
showFilePath    = false
showLoc         = false

[logger.colors]
# Colors can be specified as 24-bit hex strings or integer values
debug     = "#00bfff"
info      = "#32cd32"
warn      = "#ffd700"
error     = "#ff4500"
highlight = "#00ffff"